apiVersion: v1
kind: ResourceQuota
metadata:
  name: homelab-workload-budget
  namespace: homelab
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "10"
    persistentvolumeclaims: "4"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: homelab-default-resources
  namespace: homelab
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
      min:
        cpu: 25m
        memory: 64Mi
      max:
        cpu: "1"
        memory: 1Gi
